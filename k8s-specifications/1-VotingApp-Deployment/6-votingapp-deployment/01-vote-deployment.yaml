apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: vote
  name: vote
  namespace: observability-sre
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
      #- image: dockersamples/examplevotingapp_vote
      - image: 655252755560.dkr.ecr.ap-southeast-1.amazonaws.com/vote-app:latest
        name: vote
        ports:
        - containerPort: 80
          name: vote
