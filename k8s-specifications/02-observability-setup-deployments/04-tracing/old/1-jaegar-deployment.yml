apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger-collector
  namespace: observability-sre
  labels:
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.41
          ports:
            - containerPort: 16686  # UI
            - containerPort: 14250  # Collector gRPC (OTLP target) 

