---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-collector
  namespace: observability-sre
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  type: LoadBalancer
  selector:
    app: jaeger
  ports:
    - protocol: TCP
      port: 16686
      targetPort: 16686
      name: ui
    - protocol: TCP
      port: 14250
      targetPort: 14250
      name: collector-grpc


